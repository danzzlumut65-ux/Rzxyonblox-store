<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — RZXYONBLOX</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#080808;color:#fff}header{padding:18px 6%;border-bottom:1px solid #292929;display:flex;justify-content:space-between}main{max-width:1000px;margin:auto;padding:40px 6%}.box{background:#111;border:1px solid #292929;border-radius:16px;padding:22px;margin-bottom:20px}h1{margin-top:0}h2{font-size:20px}label{display:block;color:#aaa;font-size:13px;margin:12px 0 6px}input,textarea{width:100%;padding:12px;background:#090909;border:1px solid #333;border-radius:9px;color:#fff}button{padding:11px 15px;border:0;border-radius:9px;background:#e51b2b;color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#222}.danger{background:#8d111b}.row{display:grid;grid-template-columns:70px 1fr 130px 1fr auto;gap:10px;align-items:end;border-bottom:1px solid #252525;padding:15px 0}.row input{padding:10px}.login{max-width:420px;margin:100px auto;padding:30px}.msg{color:#63e67a;margin-top:10px}@media(max-width:700px){.row{grid-template-columns:1fr}.row button{width:100%}}
</style></head><body>
<header><b>RZXYONBLOX ADMIN</b><a href="index.html">← Toko</a></header>
<div id="login" class="box login"><h1>Login Admin</h1><label>Username</label><input id="user"><label>Password</label><input id="pass" type="password"><button style="margin-top:15px;width:100%" onclick="login()">Masuk</button><p style="color:#777;font-size:12px">Login admin pribadi RZXYONBLOX.</p></div>
<main id="app" style="display:none">
<div class="box"><h1>Dashboard</h1><p style="color:#999">Kelola produk dan nomor WhatsApp toko dari sini.</p></div>
<div class="box"><h2>Pengaturan Toko</h2><label>Nomor WhatsApp (format internasional, tanpa +)</label><input id="wa"><button style="margin-top:12px" onclick="saveSettings()">Simpan Pengaturan</button><p id="msg" class="msg"></p></div>
<div class="box"><h2>Produk</h2><div id="list"></div><button onclick="addProduct()">+ Tambah Produk</button> <button class="secondary" onclick="resetProducts()">Reset Produk</button></div>
</main>
<script>
const DEFAULT=[
{id:1,icon:"🛡️",name:"Bantuan Akun Roblox",price:5000,desc:"Bantuan umum terkait akun dan fitur resmi Roblox."},
{id:2,icon:"🎮",name:"Bantuan Pengaturan Akun",price:10000,desc:"Panduan dan bantuan pengaturan akun Roblox."},
{id:3,icon:"🔧",name:"Bantuan Masalah Akun",price:15000,desc:"Bantuan troubleshooting sesuai prosedur resmi."},
{id:4,icon:"⭐",name:"Paket Bantuan Premium",price:20000,desc:"Prioritas bantuan dan panduan penggunaan fitur resmi."}];
let products=JSON.parse(localStorage.getItem("rz_products")||"null")||DEFAULT;
function login(){if(document.getElementById("user").value==="rzxyadmin"&&document.getElementById("pass").value==="adminganteng"){localStorage.setItem("rz_admin","1");show()}else alert("Username atau password salah.")}
function show(){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";document.getElementById("wa").value=localStorage.getItem("rz_whatsapp")||"628979844790";render()}
function render(){document.getElementById("list").innerHTML=products.map((p,i)=>`<div class="row"><input value="${p.icon}" onchange="edit(${i},'icon',this.value)"><input value="${p.name}" onchange="edit(${i},'name',this.value)"><input type="number" value="${p.price}" onchange="edit(${i},'price',Number(this.value))"><input value="${p.desc}" onchange="edit(${i},'desc',this.value)"><button class="danger" onclick="del(${i})">Hapus</button></div>`).join("")}
function edit(i,k,v){products[i][k]=v;save()}
function save(){localStorage.setItem("rz_products",JSON.stringify(products))}
function del(i){if(confirm("Hapus produk ini?")){products.splice(i,1);save();render()}}
function addProduct(){products.push({id:Date.now(),icon:"🆕",name:"Produk Baru",price:0,desc:"Deskripsi produk."});save();render()}
function resetProducts(){if(confirm("Reset semua produk ke bawaan?")){products=DEFAULT.map(x=>({...x}));save();render()}}
function saveSettings(){localStorage.setItem("rz_whatsapp",document.getElementById("wa").value.replace(/\D/g,""));document.getElementById("msg").textContent="Pengaturan tersimpan."}
if(localStorage.getItem("rz_admin")==="1")show();
</script></body></html>
